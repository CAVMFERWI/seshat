<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categoria — Seshat</title>
  <link rel="icon" href="img/simbolo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('seshat-theme')) || 'light'; } catch (e) {}</script>
</head>
<body>
  <div id="header"></div>
  <main id="conteudo">
    <nav class="wrap crumbs" aria-label="Você está em"><a href="index.html">Início</a><span class="sep">/</span><a href="#" data-open="generos">Categorias</a><span class="sep">/</span><span data-nome></span></nav>
    <section class="page-head"><div class="wrap">
      <div><h1 data-nome></h1><p data-desc></p></div>
      <div class="count"><strong data-total></strong><span>títulos disponíveis</span></div>
    </div></section>
    <div class="wrap list-body" id="lista"></div>
  </main>
  <div id="footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const g = params.get('g') in CATEGORIAS || params.get('g') in LISTAS ? params.get('g') : 'shounen';
    const cat = CATEGORIAS[g] || LISTAS[g];
    mountLayout(g);
    document.title = `${cat.nome} — Seshat`;
    $$('[data-nome]').forEach(e => e.textContent = cat.nome);
    $('[data-desc]').textContent = cat.descricao;
    $('[data-total]').textContent = cat.itens.length;
    $('#lista').innerHTML = filtersHTML(cat.itens) + `<div class="list-content"><div class="sortbar"><span data-info></span>${sortHTML}</div><div class="grid grid-4"></div></div>`;
    mountList($('#lista'), cat.itens);
  </script>
</body>
</html>
