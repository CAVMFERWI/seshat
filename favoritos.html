<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Favoritos — Seshat</title>
  <link rel="icon" href="img/simbolo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('seshat-theme')) || 'light'; } catch (e) {}</script>
</head>
<body>
  <div id="header"></div>
  <main id="conteudo">
    <nav class="wrap crumbs" aria-label="Você está em"><a href="index.html">Início</a><span class="sep">/</span><span>Favoritos</span></nav>
    <section class="page-head"><div class="wrap">
      <div><h1>Favoritos</h1><p>Os mangás que você guardou para ler (ou comprar) depois.</p></div>
      <div class="count"><strong data-total></strong><span>favoritos</span></div>
    </div></section>
    <div class="wrap list-body"><div class="list-content" id="lista">
      <div class="sortbar"><span data-info></span>
        <label>Ordenar por <select class="select" aria-label="Ordenar por"><option value="vendidos">Mais vendidos</option><option value="menor">Menor preço</option><option value="maior">Maior preço</option><option value="az">A–Z</option></select></label>
      </div>
      <div class="grid grid-4"></div>
    </div></div>
  </main>
  <div id="footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    mountLayout();
    function draw() {
      const ids = favs.all();
      $('[data-total]').textContent = ids.length;
      const lista = $('#lista').cloneNode(true);
      $('#lista').replaceWith(lista);
      mountList(lista, ids, { label: n => `Exibindo ${n} ${n === 1 ? 'favorito' : 'favoritos'}`, vazio: 'Você ainda não tem favoritos' });
      $$('.grid-4 .fav', lista).forEach(b => b.setAttribute('aria-label', 'Remover dos favoritos'));
    }
    document.addEventListener('favs', draw);
    draw();
  </script>
</body>
</html>
