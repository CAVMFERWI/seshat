<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedido confirmado — Seshat</title>
  <link rel="icon" href="img/simbolo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('seshat-theme')) || 'light'; } catch (e) {}</script>
</head>
<body>
  <div id="header"></div>
  <main id="conteudo" class="center-page">
    <div class="big-check" aria-hidden="true">✓</div>
    <h1>Pedido confirmado!</h1>
    <p id="msg">Obrigado por comprar na Seshat. Enviamos os detalhes do pedido #SE-20481 para o seu e-mail.</p>
    <div class="btns">
      <a href="index.html" class="btn btn-dark">Voltar para a loja</a>
      <a href="pedido.html?id=SSH-2026-1042" class="btn btn-outline">Acompanhar pedido</a>
    </div>
  </main>
  <div id="footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    mountLayout();
    const ped = store.get('ultimo-pedido', null);
    if (ped) $('#msg').textContent = `Obrigado por comprar na Seshat. Enviamos os detalhes do pedido #${ped.num} (${brl(ped.total)}) para ${ped.email}.`;
    if (ped) {
      const forma = { pix: 'Pix (10% OFF)', debito: 'Cartão de débito, à vista', boleto: 'Boleto bancário',
        cartao: `Cartão de crédito em ${ped.parcelas || 1}x de ${brl(cents(ped.total / (ped.parcelas || 1)))} sem juros` }[ped.pag];
      $('#msg').insertAdjacentHTML('afterend', `<p><b>Pagamento:</b> ${forma}</p>`);
    }
  </script>
</body>
</html>
